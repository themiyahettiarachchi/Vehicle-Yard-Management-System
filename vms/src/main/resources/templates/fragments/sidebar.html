<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Sidebar Fragment -->
<div th:fragment="sidebar(activePage, userName, userRole)">
    <aside class="sidebar">
        <!-- Brand -->
        <div class="sidebar-brand">
            <h2>Vehicle Yard</h2>
            <p>Management System</p>
        </div>

        <!-- User Profile -->
        <div class="sidebar-user">
            <div class="user-avatar">
                <span th:text="${#strings.substring(userName, 0, 1) + #strings.substring(userRole, 0, 1)}">SL</span>
            </div>
            <div class="user-info">
                <div class="user-name" th:text="${userName}">Sales Lead</div>
                <div class="user-role" th:text="${userRole}">Sales</div>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="sidebar-nav">
            <a th:href="@{/dashboard}" class="nav-item" th:classappend="${activePage == 'dashboard'} ? 'active' : ''">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                <span>Dashboard</span>
            </a>
            <a th:href="@{/sales}" class="nav-item" th:classappend="${activePage == 'sales'} ? 'active' : ''">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span>Sales</span>
            </a>
        </nav>

        <!-- Footer - Logout -->
        <div class="sidebar-footer">
            <a href="#" class="nav-item"
                onclick="alert('Logout functionality will be implemented with backend authentication')">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Logout</span>
            </a>
        </div>
    </aside>
</div>

</html>
