<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Vehicle Yard Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>

<body>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar(${activePage}, ${userName}, ${userRole})}"></div>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Page Header -->
        <div class="page-header">
            <div>
                <h1>Dashboard</h1>
                <p>Welcome back, <span th:text="${userName}">Sales Lead</span></p>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <!-- Total Vehicles -->
            <div class="stat-card">
                <div>
                    <div class="stat-label">Total Vehicles</div>
                    <div class="stat-value" th:text="${totalVehicles}">0</div>
                </div>
                <div class="stat-icon blue">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M5 17h14M5 17a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2M5 17l-1 3h16l-1-3">
                        </path>
                        <circle cx="7.5" cy="17" r="1.5"></circle>
                        <circle cx="16.5" cy="17" r="1.5"></circle>
                    </svg>
                </div>
            </div>

            <!-- Total Sales -->
            <div class="stat-card">
                <div>
                    <div class="stat-label">Total Sales</div>
                    <div class="stat-value" th:text="${totalSales}">0</div>
                </div>
                <div class="stat-icon green">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                        <polyline points="17 6 23 6 23 12"></polyline>
                    </svg>
                </div>
            </div>

            <!-- Total Revenue -->
            <div class="stat-card">
                <div>
                    <div class="stat-label">Total Revenue</div>
                    <div class="stat-value"
                        th:text="'$' + ${#numbers.formatDecimal(totalRevenue, 1, 'COMMA', 0, 'POINT')}">$0</div>
                </div>
                <div class="stat-icon teal">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="1" x2="12" y2="23"></line>
                        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg>
                </div>
            </div>

            <!-- Total Profit -->
            <div class="stat-card">
                <div>
                    <div class="stat-label">Total Profit</div>
                    <div class="stat-value" th:classappend="${totalProfit < 0} ? 'negative' : ''"
                        th:text="'$' + ${#numbers.formatDecimal(totalProfit, 1, 'COMMA', 0, 'POINT')}">$0</div>
                </div>
                <div class="stat-icon purple">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="1" x2="12" y2="23"></line>
                        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="charts-grid">
            <!-- Monthly Sales Trend -->
            <div class="chart-card">
                <h3>Monthly Sales Trend</h3>
                <div class="chart-container">
                    <canvas id="salesChart"></canvas>
                </div>
            </div>

            <!-- Revenue Trend -->
            <div class="chart-card">
                <h3>Revenue Trend</h3>
                <div class="chart-container">
                    <canvas id="revenueChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Activity Feed -->
        <div class="feed-card">
            <h3>Activity Feed</h3>
            <div th:each="item : ${activityFeed}" class="feed-item">
                <div class="feed-dot" th:style="'background-color: ' + ${item.color}"></div>
                <div class="feed-content">
                    <div class="feed-type" th:text="${item.type}">Vehicle Sold</div>
                    <div class="feed-desc" th:text="${item.description}">Description</div>
                    <div class="feed-date" th:text="${#temporals.format(item.date, 'M/dd/yyyy')}">Date</div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(activityFeed)}"
                style="text-align: center; color: var(--text-muted); padding: 24px;">
                No recent activity
            </div>
        </div>
    </main>

    <!-- Help Button -->
    <button class="help-btn" title="Help">?</button>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const monthLabels = /*[[${monthLabels}]]*/[];
        const monthlySalesData = /*[[${monthlySalesData}]]*/[];
        const monthlyRevenueData = /*[[${monthlyRevenueData}]]*/[];

        // Monthly Sales Trend Chart
        const salesCtx = document.getElementById('salesChart').getContext('2d');
        new Chart(salesCtx, {
            type: 'line',
            data: {
                labels: monthLabels,
                datasets: [{
                    label: 'sales',
                    data: monthlySalesData,
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.05)',
                    borderWidth: 2,
                    pointBackgroundColor: '#3b82f6',
                    pointBorderColor: '#ffffff',
                    pointBorderWidth: 2,
                    pointRadius: 5,
                    pointHoverRadius: 7,
                    tension: 0.3,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#fff',
                        titleColor: '#1e293b',
                        bodyColor: '#3b82f6',
                        borderColor: '#e2e8f0',
                        borderWidth: 1,
                        padding: 12,
                        displayColors: false,
                        callbacks: {
                            title: function (tooltipItems) {
                                return tooltipItems[0].label;
                            },
                            label: function (context) {
                                return 'sales : ' + context.parsed.y;
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        grid: { color: 'rgba(0,0,0,0.05)', drawBorder: false },
                        ticks: { color: '#94a3b8', font: { size: 12 } }
                    },
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(0,0,0,0.05)', drawBorder: false },
                        ticks: { color: '#94a3b8', font: { size: 12 } }
                    }
                }
            }
        });

        // Revenue Trend Chart
        const revenueCtx = document.getElementById('revenueChart').getContext('2d');
        new Chart(revenueCtx, {
            type: 'line',
            data: {
                labels: monthLabels,
                datasets: [{
                    label: 'revenue',
                    data: monthlyRevenueData,
                    borderColor: '#14b8a6',
                    backgroundColor: 'rgba(20, 184, 166, 0.05)',
                    borderWidth: 2,
                    pointBackgroundColor: '#14b8a6',
                    pointBorderColor: '#ffffff',
                    pointBorderWidth: 2,
                    pointRadius: 5,
                    pointHoverRadius: 7,
                    tension: 0.3,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#fff',
                        titleColor: '#1e293b',
                        bodyColor: '#14b8a6',
                        borderColor: '#e2e8f0',
                        borderWidth: 1,
                        padding: 12,
                        displayColors: false,
                        callbacks: {
                            title: function (tooltipItems) {
                                return tooltipItems[0].label;
                            },
                            label: function (context) {
                                return 'revenue : ' + context.parsed.y;
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        grid: { color: 'rgba(0,0,0,0.05)', drawBorder: false },
                        ticks: { color: '#94a3b8', font: { size: 12 } }
                    },
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(0,0,0,0.05)', drawBorder: false },
                        ticks: { color: '#94a3b8', font: { size: 12 } }
                    }
                }
            }
        });
        /*]]>*/
    </script>
</body>

</html>
